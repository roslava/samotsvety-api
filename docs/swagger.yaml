        type: string
      metaphysical_properties:
        items:
          type: string
        type: array
      ritual_uses:
        type: string
      zodiac:
        items:
          type: string
        type: array
    type: object
  github_com_roslava_samotsvety-api_internal_domain.GalleryImage:
    properties:
      description_en:
        type: string
      description_ru:
        type: string
      type:
        description: specimen, polished, jewelry, micro и т.д.
        type: string
      url:
        type: string
    type: object
  github_com_roslava_samotsvety-api_internal_domain.Hardness:
    properties:
      max:
