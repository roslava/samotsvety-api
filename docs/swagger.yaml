        type: array
      color_description:
        type: string
      esoteric:
        $ref: '#/definitions/github_com_roslava_samotsvety-api_internal_domain.Esoteric'
      lore:
        type: string
      name:
        type: string
      synonyms:
        items:
          type: string
        type: array
    required:
    - lore
    - name
    type: object
  github_com_roslava_samotsvety-api_internal_domain.Locality:
    properties:
      country:
        type: string
      description_en:
        type: string
      description_ru:
        type: string
      famous:
        type: boolean
      is_russian:
        type: boolean
      locality:
        type: string
      region:
        type: string
    type: object
  github_com_roslava_samotsvety-api_internal_domain.Mineral:
    properties:
      created_at:
        type: string
      gallery:
        items:
          $ref: '#/definitions/github_com_roslava_samotsvety-api_internal_domain.GalleryImage'
        type: array
      i18n:
        $ref: '#/definitions/github_com_roslava_samotsvety-api_internal_domain.I18n'
      localities:
        items:
          $ref: '#/definitions/github_com_roslava_samotsvety-api_internal_domain.Locality'
        type: array
      main_image_url:
        type: string
      related_minerals:
        items:
          type: string
        type: array
      safety_notes:
        type: string
