    - crystal_system
    - hardness
    - luster
    - mineral_group
    - rarity
    - specific_gravity
    - streak
    - transparency
    type: object
  github_com_roslava_samotsvety-api_internal_domain.SpecificGravity:
    properties:
      max:
        minimum: 1
        type: number
      min:
        minimum: 1
        type: number
    required:
    - max
    - min
    type: object
  github_com_roslava_samotsvety-api_internal_repository.FilterValues:
    properties:
      colors:
        items:
          type: string
        type: array
      countries:
        items:
          type: string
        type: array
      hardness_range:
        properties:
          max:
            type: number
          min:
            type: number
        type: object
      mineral_groups:
        items:
          type: string
        type: array
      rarities:
        items:
          type: string
        type: array
    type: object
  internal_handler.ErrorResponse:
    properties:
      code:
        type: integer
      error:
        type: string
      message:
        type: string
    type: object
  internal_handler.ListResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/github_com_roslava_samotsvety-api_internal_domain.Mineral'
        type: array
      limit:
        type: integer
      page:
        type: integer
      total:
        type: integer
    type: object
info:
  contact: {}
paths:
  /api/v1/filters:
    get:
      description: Возвращает списки для фильтров фронтенда
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_roslava_samotsvety-api_internal_repository.FilterValues'
      summary: Получить доступные значения фильтров
      tags:
      - filters
  /api/v1/minerals:
    get:
      consumes:
      - application/json
      description: Возвращает список минералов с фильтрацией и пагинацией
      parameters:
      - default: ru
        description: Язык (ru/en)
        in: query
        name: lang
        type: string
      - default: normal
        description: Режим (normal/esoteric)
        in: query
        name: view
        type: string
      - description: Редкость
        in: query
        name: rarity
        type: string
      - description: Минимальная твёрдость
        in: query
        name: hardness_min
        type: number
      - description: Максимальная твёрдость
        in: query
        name: hardness_max
        type: number
      - description: Только российские
        in: query
        name: russian_only
        type: boolean
      - default: 20
        description: Лимит
        in: query
        name: limit
        type: integer
      - default: 1
        description: Страница
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ListResponse'
      summary: Получить список минералов
      tags:
      - minerals
  /api/v1/minerals/{slug}:
    get:
      consumes:
      - application/json
      description: Возвращает полную карточку минерала
      parameters:
      - description: Slug минерала
        in: path
        name: slug
        required: true
        type: string
      - default: ru
        description: Язык (ru/en)
        in: query
        name: lang
        type: string
      - default: normal
        description: Режим (normal/esoteric)
        in: query
        name: view
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_roslava_samotsvety-api_internal_domain.Mineral'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Получить минерал по slug
      tags:
      - minerals
  /api/v1/search:
    get:
      consumes:
      - application/json
      description: Полнотекстовый поиск по названию, синонимам, лору и химической
        формуле
      parameters:
      - description: Поисковый запрос
        in: query
        name: q
        required: true
        type: string
      - default: ru
        description: Язык (ru/en)
        in: query
        name: lang
        type: string
      - default: normal
        description: Режим (normal/esoteric)
        in: query
        name: view
        type: string
      - default: 20
        description: Лимит
        in: query
        name: limit
        type: integer
      - default: 1
        description: Страница
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ListResponse'
      summary: Поиск минералов
      tags:
      - search
swagger: "2.0"
