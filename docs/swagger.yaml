info:
  contact: {}
paths:
  /api/v1/filters:
    get:
      description: Возвращает списки доступных значений для фронтенда
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_roslava_samotsvety-api_internal_repository.FilterValues'
      summary: Получить значения для фильтров
      tags:
      - filters
  /api/v1/minerals:
    get:
      consumes:
      - application/json
      description: Возвращает список самоцветов с поддержкой фильтрации, сортировки
        и пагинации
      parameters:
      - description: Номер страницы
        in: query
        name: page
        type: integer
      - description: Количество на странице
        in: query
        maximum: 100
        name: limit
        type: integer
      - description: Сортировка
        enum:
        - created_at
        - name
        - rarity
        - hardness
        in: query
        name: sort
        type: string
      - description: Порядок
        enum:
        - asc
        - desc
        in: query
        name: order
        type: string
      - description: Язык
        enum:
        - ru
        - en
        in: query
        name: lang
        type: string
      - description: Режим
        enum:
        - normal
        - esoteric
        in: query
        name: view
        type: string
      - description: Только российские
        in: query
        name: russian_only
        type: boolean
      - description: Редкость
        in: query
        name: rarity
        type: string
      - description: Группа
        in: query
        name: mineral_group
        type: string
      - description: Цвет
        in: query
        name: color
        type: string
      - description: Минимальная твёрдость
        in: query
        name: hardness_min
        type: number
      - description: Максимальная твёрдость
        in: query
        name: hardness_max
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ListResponse'
      summary: Получить список минералов
      tags:
      - minerals
    post:
      consumes:
      - application/json
      description: Создаёт новый самоцвет/минерал в базе (админка)
      parameters:
      - description: Данные минерала
        in: body
        name: mineral
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreateMineralRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_roslava_samotsvety-api_internal_domain.Mineral'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "409":
          description: Slug уже существует
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Создать новый минерал
      tags:
      - minerals
  /api/v1/minerals/{slug}:
    delete:
      consumes:
      - application/json
      description: Удаляет минерал по slug (админка)
      parameters:
      - description: Slug минерала
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Удалить минерал
      tags:
      - minerals
    get:
      consumes:
      - application/json
      description: Возвращает полную детальную карточку самоцвета
      parameters:
      - description: Slug минерала
        in: path
        name: slug
        required: true
        type: string
      - description: Язык
        in: query
        name: lang
        type: string
      - description: Режим
        in: query
        name: view
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_roslava_samotsvety-api_internal_domain.Mineral'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Получить минерал по slug
      tags:
      - minerals
  /api/v1/posts:
    get:
      description: Список постов с фильтрацией и пагинацией
      parameters:
      - description: Страница
        in: query
        name: page
        type: integer
      - description: Лимит
        in: query
        name: limit
        type: integer
      - description: Тип (blog, guide...)
        in: query
        name: type
        type: string
      - description: Тег
        in: query
        name: tag
        type: string
      - description: Связанный камень
        in: query
        name: gem_slug
        type: string
      - description: Только опубликованные
        in: query
        name: published
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/gin.H'
      summary: Получить список статей
      tags:
      - posts
    post:
      consumes:
      - application/json
      description: Создаёт новую статью (только админ)
      parameters:
      - description: Данные статьи
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/internal_handler.CreatePostRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/github_com_roslava_samotsvety-api_internal_domain.Post'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "409":
          description: Slug уже существует
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Создать новую статью
      tags:
      - posts
  /api/v1/posts/{slug}:
    delete:
      parameters:
      - description: Slug статьи
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Удалить статью
      tags:
      - posts
    get:
      parameters:
      - description: Slug статьи
        in: path
        name: slug
        required: true
        type: string
      - description: Язык
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_roslava_samotsvety-api_internal_domain.Post'
      summary: Получить статью по slug
      tags:
      - posts
    put:
      consumes:
      - application/json
      parameters:
      - description: Slug статьи
        in: path
        name: slug
        required: true
        type: string
      - description: Данные для обновления
        in: body
        name: post
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdatePostRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_roslava_samotsvety-api_internal_domain.Post'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Обновить статью
      tags:
      - posts
  /api/v1/search:
    get:
      consumes:
      - application/json
      description: Полнотекстовый поиск по названию, синонимам, lore и химической
        формуле (работает на ru+en)
      parameters:
      - description: Поисковый запрос
        in: query
        name: q
        required: true
        type: string
      - description: Язык ответа
        in: query
        name: lang
        type: string
      - description: Режим
        in: query
        name: view
        type: string
      - description: Лимит
        in: query
        name: limit
        type: integer
      - description: Страница
        in: query
        name: page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_handler.ListResponse'
      summary: Поиск минералов
      tags:
      - search
  /minerals/{slug}:
    put:
      consumes:
      - application/json
      parameters:
      - description: Slug минерала
        in: path
        name: slug
        required: true
        type: string
      - description: Данные для обновления
        in: body
        name: mineral
        required: true
        schema:
          $ref: '#/definitions/internal_handler.UpdateMineralRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/github_com_roslava_samotsvety-api_internal_domain.Mineral'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/internal_handler.ErrorResponse'
      summary: Обновить минерал
      tags:
      - minerals
swagger: "2.0"
