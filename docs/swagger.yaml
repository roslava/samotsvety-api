    x-enum-varnames:
    - RarityCommon
    - RarityUncommon
    - RarityRare
    - RarityVeryRare
  github_com_roslava_samotsvety-api_internal_domain.Scientific:
    properties:
      chemical_formula:
        type: string
      cleavage:
        type: string
      crystal_habit:
        type: string
      crystal_system:
        type: string
      fracture:
        type: string
      hardness:
        $ref: '#/definitions/github_com_roslava_samotsvety-api_internal_domain.Hardness'
